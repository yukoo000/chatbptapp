<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:sans-serif; background:#FaFFFD; }

#chat { height:90vh; overflow-y:auto; padding:10px; }

.message { display:flex; flex-direction:column; margin:8px 0; }

.user { align-items:flex-end; }

.bot { align-items:flex-start; }

.bubble { max-width:70%; padding:10px 14px; border-radius:16px; font-size:14px; position:relative; }

.user .bubble { background:#06c755; color:white; }

.bot .bubble { background:white; }

.time { font-size:10px; color:gray; margin-top:2px; }

#inputArea {
  position: fixed;
  bottom: env(safe-area-inset-bottom);
  width: 100%;
  display: flex;
  background: white;
  border-top: 1px solid #ccc;
  padding-bottom: 10px;
}

#msg { flex:1; padding:12px; border:none; font-size:16px; }

button { padding:12px; background:#06c755; color:white; border:none; cursor:pointer; }

.bot::before { content:""; width:32px; height:32px; background:gray; border-radius:50%; margin-right:8px; }

.bubble img { margin-top:5px; max-width:200px; border-radius:8px; }

</style>
</head>
<body>

<div id="chat"></div>

<div id="inputArea">
  <input id="msg" placeholder="メッセージ入力">
  <button onclick="send()">送信</button>
</div>
</div>
</div>
</div>


<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyZt7nziC-QFXwUcJlKFLOUtEH3Q9hHT5dHSLbO8GO9kc0h-ig3pepg19bJmKYRqDba/exec";

function addMessage(text, type, imgUrl="") {
  const chat = document.getElementById("chat");
  const msgDiv = document.createElement("div");
  msgDiv.className = "message " + type;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerText = text;

  if(imgUrl) {
    const img = document.createElement("img");
    img.src = imgUrl;
    bubble.appendChild(img);
  }

  const time = document.createElement("div");
  time.className = "time";
  time.innerText = new Date().toLocaleTimeString();

  msgDiv.appendChild(bubble);
  msgDiv.appendChild(time);
  chat.appendChild(msgDiv);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const input = document.getElementById("msg");
  const text = input.value;
  if(!text) return;

  addMessage(text, "user");
  input.value = "";
  addMessage("入力中...", "bot");

  const res = await fetch(API_URL, {
    method:"POST",
    body: JSON.stringify({ user:"user1", message:text })
  });

  const data = await res.json();

  const chat = document.getElementById("chat");
  const lastMsg = chat.lastChild;
  lastMsg.querySelector(".bubble").innerText = data.reply;

  // 画像があれば追加
  if(data.image) {
    const img = document.createElement("img");
    img.src = data.image;
    lastMsg.querySelector(".bubble").appendChild(img);
  }
}

document.getElementById("msg").addEventListener("keypress", function(e){
  if(e.key==="Enter") send();
});
</script>

</body>
</html>
